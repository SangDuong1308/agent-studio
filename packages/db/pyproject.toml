[project]
name = "agent-studio-db"
version = "0.1.0"
description = "SQLAlchemy models + Alembic migrations for Agent Studio"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "agent-studio-common",
]

[tool.uv.sources]
agent-studio-common = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
