# Copy to secrets.yaml and fill in real values (or create via `kubectl create secret`).
# NEVER commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: agent-studio-secrets
  namespace: agent-studio
type: Opaque
stringData:
  # Use a strong generated password here and in DATABASE_URL (not "agent").
  POSTGRES_USER: "agent"
  POSTGRES_PASSWORD: "replace-with-a-strong-password"
  POSTGRES_DB: "agentstudio"
  DATABASE_URL: "postgresql+asyncpg://agent:replace-with-a-strong-password@postgres:5432/agentstudio"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
  JWT_SECRET: "replace-with-openssl-rand-hex-32"
  LLM_PROVIDER: "vertex"
  GOOGLE_CLOUD_PROJECT: "your-gcp-project-id"
  # Gemini 3.x is served from the global endpoint, not us-central1.
  GOOGLE_CLOUD_LOCATION: "global"
  VERTEX_CHAT_MODEL: "gemini-3.5-flash-lite"
  VERTEX_EMBEDDING_MODEL: "text-embedding-005"
  # production => services refuse to start with a weak JWT_SECRET or no INTERNAL_API_KEY.
  APP_ENV: "production"
  INTERNAL_API_KEY: "replace-with-openssl-rand-hex-32"
  # The public URL(s) of the frontend, e.g. https://studio.example.com
  CORS_ORIGINS: "http://REPLACE_WITH_FRONTEND_EXTERNAL_IP"
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
  LANGFUSE_HOST: "https://cloud.langfuse.com"
  AGENT_RUNTIME_URL: "http://agent-runtime:8003"
