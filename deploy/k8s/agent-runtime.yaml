apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: agent-studio
spec:
  selector:
    app: agent-runtime
  ports:
    - port: 8003
      targetPort: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: agent-studio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-runtime
  template:
    metadata:
      labels:
        app: agent-runtime
    spec:
      containers:
        - name: agent-runtime
          image: REGISTRY/agent-studio-agent-runtime:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          envFrom:
            - secretRef:
                name: agent-studio-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
