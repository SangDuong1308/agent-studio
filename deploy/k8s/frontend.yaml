apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: agent-studio
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agent-studio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: REGISTRY/agent-studio-frontend:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # Point at the gateway's external address in your environment.
            - name: NEXT_PUBLIC_API_URL
              value: "http://REPLACE_WITH_GATEWAY_EXTERNAL_IP"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
