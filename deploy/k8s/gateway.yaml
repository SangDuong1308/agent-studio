apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: agent-studio
spec:
  type: LoadBalancer # GKE provisions an external IP; use ClusterIP + Ingress in prod
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: agent-studio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # Run DB migrations once before the app starts.
      initContainers:
        - name: migrate
          image: REGISTRY/agent-studio-gateway:TAG
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cd /app/packages/db && alembic upgrade head"]
          envFrom:
            - secretRef:
                name: agent-studio-secrets
      containers:
        - name: gateway
          image: REGISTRY/agent-studio-gateway:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: agent-studio-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
