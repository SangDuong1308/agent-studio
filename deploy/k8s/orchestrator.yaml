apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: agent-studio
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: agent-studio
spec:
  replicas: 1 # single consumer keeps saga ordering simple for a demo
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: REGISTRY/agent-studio-orchestrator:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: agent-studio-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
