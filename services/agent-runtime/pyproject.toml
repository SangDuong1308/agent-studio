[project]
name = "agent-studio-agent-runtime"
version = "0.1.0"
description = "LangGraph multi-agent execution with RAG over pgvector + LangFuse"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "agent-studio-common",
    "agent-studio-db",
]

[project.optional-dependencies]
# vertex = ["langchain-google-genai>=2.0"]
vertex = ["langchain-google-vertexai>=3.0,<4.0"]

langfuse = ["langfuse>=3.0,<4.0", "langchain>=0.3"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20"]

[tool.uv.sources]
agent-studio-common = { workspace = true }
agent-studio-db = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
