[project]
name = "agent-studio-gateway"
version = "0.1.0"
description = "Public REST API gateway: auth, agents CRUD, saga kickoff"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "agent-studio-common",
    "agent-studio-db",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20"]

[tool.uv.sources]
agent-studio-common = { workspace = true }
agent-studio-db = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
