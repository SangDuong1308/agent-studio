[project]
name = "agent-studio-orchestrator"
version = "0.1.0"
description = "Orchestration-based Saga for agent provisioning"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "agent-studio-common",
    "agent-studio-db",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20"]

[tool.uv.sources]
agent-studio-common = { workspace = true }
agent-studio-db = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
