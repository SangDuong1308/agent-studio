[project]
name = "agent-studio"
version = "0.1.0"
description = "Agent Studio Monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grandalf>=0.8",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

# Root tooling config (ruff). Each package/service has its own pyproject for deps.
[tool.ruff]
line-length = 90
target-version = "py311"
extend-exclude = [".venv", "frontend", "**/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls in defaults (Depends())

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.38",
]
